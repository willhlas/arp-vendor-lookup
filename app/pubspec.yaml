name: arp_vendor_lookup
description: "Client app for looking up ARP vendor information."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.6

dependencies:
  app_ui:
    path: ../packages/app_ui
  arp_resolver:
    path: ../packages/arp_resolver
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  vendor_api_client:
    path: ../packages/vendor_api_client
  vendor_lookup_repository:
    path: ../packages/vendor_lookup_repository

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter_launcher_icons:
  ios: false
  android: false
  image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  generate: true
